<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ lesson.title }}</title>
    <link href="/static/style.css" rel="stylesheet">
    <style>body{font-family:Cairo,Arial,sans-serif}</style>
</head>
<body>
    <main class="container">
        <h2>{{ lesson.title }}</h2>
        <p>{{ lesson.description }}</p>
        {% if lesson.content %}
        <div class="card" style="margin-top:16px">
            <div class="muted right">محتوى الدرس</div>
            <div style="margin-top:8px;line-height:1.8">{{ lesson.content }}</div>
        </div>
        {% endif %}
        {% if lesson.video_url %}
            <div class="video">
                <iframe width="100%" height="400" src="{{ lesson.video_url }}" title="video" frameborder="0" allowfullscreen></iframe>
            </div>
        {% endif %}
        <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
            {% if prev_lesson %}
            <a class="btn" href="/lesson/{{ prev_lesson.id }}">الدرس السابق</a>
            {% endif %}
            {% if next_lesson %}
            <a class="btn" href="/lesson/{{ next_lesson.id }}">الدرس التالي</a>
            {% endif %}

            {% if session.user_id %}
            <form method="post" action="/lesson/complete/{{ lesson.id }}" style="display:inline">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button class="btn" type="submit">تعليم كمكتمل</button>
            </form>
            {% endif %}
        </div>
        <a href="/lessons">العودة إلى الدروس</a>
    </main>
</body>
</html>
