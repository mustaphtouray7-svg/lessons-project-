<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تسجيل الدخول</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    {% include "_header.html" %}
    <main class="container page-shell--narrow">
        <section class="form-card">
            <h1 class="page-heading">مرحباً بعودتك</h1>
            <p class="page-lead">سجل الدخول لمتابعة تعلمك.</p>
            {% include "_flash_messages.html" %}
            <form method="post" action="/login">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="email">البريد الإلكتروني</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
                <label for="password">كلمة المرور</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button type="submit">تسجيل الدخول</button>
            </form>
            <p><a href="/forgot">نسيت كلمة المرور؟</a></p>
            <p>لا تملك حساباً؟ <a href="/register">إنشاء حساب طالب</a></p>
        </section>
    </main>
</body>
</html>
