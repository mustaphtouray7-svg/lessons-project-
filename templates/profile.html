<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>الملف الشخصي</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    {% include "_header.html" %}
    <main class="container page-shell--narrow">
        <section class="form-card">
            <h1 class="page-heading">الملف الشخصي</h1>
            <p class="page-lead">حدّث بيانات حسابك.</p>
            {% include "_flash_messages.html" %}
            <form method="post" action="/profile">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="username">الاسم</label>
                <input id="username" name="username" value="{{ user.username }}" autocomplete="name" required>
                <label for="email">البريد الإلكتروني (لا يمكن تغييره)</label>
                <input id="email" type="email" value="{{ user.email }}" disabled>
                <h2 class="form-subheading">تغيير كلمة المرور (اختياري)</h2>
                <label for="password">كلمة المرور الجديدة</label>
                <input id="password" name="password" type="password" autocomplete="new-password">
                <label for="confirm">تأكيد كلمة المرور</label>
                <input id="confirm" name="confirm" type="password" autocomplete="new-password">
                <button type="submit">حفظ التغييرات</button>
            </form>
            <p><a href="/dashboard">العودة إلى لوحة الطالب</a></p>
        </section>
    </main>
</body>
</html>
