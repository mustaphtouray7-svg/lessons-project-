<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المواد - منصة علم الفرائض</title>
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">منصة علم الفرائض</div>
        <nav>
            <a href="/">الرئيسية</a>
            <a href="/subjects">المواد</a>
            {% if session.username %}
            <a href="/dashboard">لوحة الطالب</a>
            <a href="/logout">تسجيل الخروج</a>
            {% else %}
            <a href="/login">تسجيل الدخول</a>
            <a href="/register">إنشاء حساب</a>
            {% endif %}
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="section-title">
                <h1>المواد</h1>
                <p>اختر المادة التي تريد تعلمها</p>
            </div>

            <div class="cards">
                {% for key, name in category_names.items() %}
                <div class="card lessons-card center">
                    <h3>{{ name }}</h3>
                    <a class="btn" href="/category/{{ key }}">دروس {{ name }}</a>
                </div>
                {% endfor %}
            </div>
        </div>
    </main>

    <footer><p>منصة علم الفرائض</p></footer>
</body>
</html>
