<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>إنشاء حساب</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    {% include "_header.html" %}
    <main class="container page-shell--narrow">
        <section class="form-card">
            <h1 class="page-heading">إنشاء حساب طالب</h1>
            <p class="page-lead">أنشئ حسابك وابدأ متابعة دروسك.</p>
            {% include "_flash_messages.html" %}
            <form method="post" action="/register">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="username">الاسم</label>
                <input id="username" name="username" autocomplete="name" required>
                <label for="email">البريد الإلكتروني</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
                <label for="password">كلمة المرور</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required>
                <label for="confirm">تأكيد كلمة المرور</label>
                <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
                <button type="submit">إنشاء الحساب</button>
            </form>
            <p>لديك حساب؟ <a href="/login">تسجيل الدخول</a></p>
        </section>
    </main>
</body>
</html>
